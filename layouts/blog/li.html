<li>
	<a href="{{ .Permalink }}">{{ .Title | markdownify }}</a>
  <span style="float: right; color: var(--muted)">{{.Date.Format "2006-01-02" }} ({{ partial "bratwurst-date.html" .Date}})</span>
	<br/>
	<p>{{ replaceRE `<a( [A-z]+=".*")*>(.*)<\/a>` `$2` .Summary | safeHTML }}</p>
	{{ if .Truncated }}
	<p>...</p>
	{{ end }}
</li>
